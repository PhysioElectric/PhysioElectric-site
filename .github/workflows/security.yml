# =============================================================
#  Security CI — lightweight, no project dependency added.
#
#  1. php -l on every PHP file (same check as CHANGES-FIX.md)
#  2. node --check on the two browser bundles
#  3. hadolint on the Dockerfile
#  4. trivy scan of the built image (fail on HIGH/CRITICAL)
#  5. phpstan (standalone phar, base level) over the application
#     logic — deliberately NOT added via composer
# =============================================================
name: security

on:
  push:
    branches: [bugfix, bugfix-hardened, main, develop, release]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP / JS lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: php -l on every PHP file
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: node --check on browser bundles
        run: |
          node --check app/assets/js/contact.js
          node --check app/assets/js/admin.js
          node --check app/assets/js/main.js

  phpstan:
    name: PHPStan (standalone phar, base level)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Download phpstan.phar (no composer dependency for the project)
        run: |
          curl -fsSLO https://github.com/phpstan/phpstan/releases/latest/download/phpstan.phar
          php phpstan.phar --version
      - name: Analyse application logic
        run: |
          # Views are HTML templates driven by extract(); they are covered by
          # php -l + the e2e suite instead of static analysis.
          php phpstan.phar analyse --no-progress \
            --level=1 \
            --memory-limit=1G \
            app/config.php app/index.php app/core app/models app/controllers app/setup

  dockerfile:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # Project decisions documented in .hadolint.yaml (e.g. base image
          # version churn is handled by the php:8.3 release cadence).
          config: .hadolint.yaml

  trivy:
    name: Trivy image scan (HIGH/CRITICAL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t physioelectric-site:ci .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'physioelectric-site:ci' # نام ایمیج شما
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # این خط کلیدی است: اکشن را متوقف نکن

          sarif-report: trivy-results.sarif
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
