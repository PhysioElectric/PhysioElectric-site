    </script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        /* بهینه سازی پس زمینه برای رفع کندی (استفاده از گرادیانت به جای بلور سنگین) */
        body {
            background-color: #F8FAFC; 
            color: #0F172A;
            overflow: hidden; 
            cursor: none; 
            /* گرادیانت شعاعی سریع و بدون افت فریم */
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(191,219,254,0.4) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(233,213,255,0.4) 0%, transparent 40%);
        }
        .ltr { direction: ltr; display: inline-block; }

        /* Custom Cursor */
        #custom-cursor {
            position: fixed; top: 0; left: 0; width: 10px; height: 10px;
            background-color: #3b82f6; border-radius: 50%; pointer-events: none; z-index: 99999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.8);
            mix-blend-mode: exclusion;
        }
        #custom-cursor::after {
            content: ''; position: absolute; width: 44px; height: 44px;
            border: 1.5px solid rgba(59, 130, 246, 0.5); border-radius: 50%;
            transition: transform 0.2s, border-color 0.2s;
        }
        #custom-cursor span { display: none; color: white; font-size: 10px; font-weight: 800; letter-spacing: 2px; font-family: 'Inter', sans-serif; text-transform: uppercase; }
        #custom-cursor.active { width: 75px; height: 75px; mix-blend-mode: normal; background-color: rgba(59, 130, 246, 0.95); }
        #custom-cursor.active::after { transform: scale(1.5); border-color: transparent; }
        #custom-cursor.active span { display: block; }

        /* Modified Track: ساختار جدید برای قرارگیری تضمینی در مرکز */
        .slider-track {
            display: flex;
            width: 100vw;
            flex: 1; /* گرفتن فضای باقیمانده به صورت هوشمند */
            min-height: 0;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
            cursor: grab;
            /* فضای خالی در دو طرف اسلایدر برای دیده شدن لبه کارت‌های بعدی در موبایل (Peeking effect) */
            padding: 0 6vw; 
        }
        @media (min-width: 1024px) {
            .slider-track { padding: 0; } /* در دسکتاپ نیازی به پدینگ نیست */
        }

        .slider-track::-webkit-scrollbar { display: none; }
        .slider-track:active { cursor: grabbing; }

        /* Container برای هر اسلاید که سایز کامل صفحه را میگیرد */
        .slide-container {
            /* در موبایل عرض کمتری می‌گیرد (88 درصد) تا کارت بعدی دیده شود */
            flex: 0 0 88vw;
            width: 88vw;
            height: 100%;
            scroll-snap-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1vh 2vw; 
        }
        @media (min-width: 1024px) {
            .slide-container {
                /* در دسکتاپ عرض کامل می‌گیرد */
                flex: 0 0 100vw;
                width: 100vw;
                padding: 1vh 2vw; /* کاهش پدینگ برای بزرگتر شدن کارت */
            }
        }

        /* The Card: اینک سایز کامل و بی نقص است */
        .project-card {
            width: 100%;
            max-width: 1400px; /* عرض به شدت افزایش یافته (از 1200 به 1400) */
            height: 100%;
            max-height: 92vh; /* ارتفاع افزایش یافته برای پر کردن بهتر صفحه */
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.85));
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            
            /* سایه دیفالت */
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            
            /* پرفورمنس: بجای فیلترهای سنگین، فقط scale و opacity */
            transform: scale(0.9);
            opacity: 0.4;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease;
            will-change: transform, opacity;
            pointer-events: none;
        }
        
        @media (min-width: 1024px) {
            .project-card { flex-direction: row; }
        }

        /* Active State - سایه بسیار خاص و درخشان */
        .slide-container.is-active .project-card {
            transform: scale(1);
            opacity: 1;
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.2),          /* سایه عمیق */
                0 0 45px -10px rgba(59, 130, 246, 0.3),      /* هاله آبی */
                inset 0 2px 5px rgba(255, 255, 255, 1);      /* شاین لبه بالایی */
            pointer-events: auto;
        }

        /* Content Areas */
        .card-info { 
            flex: 1.2; /* در موبایل فضای بیشتری به متن میدهیم */
            padding: 20px 24px; /* پدینگ بهینه برای موبایل */
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            position: relative; 
            z-index: 10; 
            overflow-y: auto; /* اگر صفحه کوچک بود محتوا اسکرول بخورد و بیرون نزند */
        }
        @media (min-width: 1024px) { 
            .card-info { flex: 1; padding: 30px 40px; } 
        }

        .card-visual {
            flex: 0.8; /* در موبایل فضای کمتری میگیرد تا متن راحت جا شود */
            min-height: 180px; /* جلوگیری از ناپدید شدن عکس در موبایل */
            background: #020617; 
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-shadow: inset 0 20px 40px -20px rgba(0,0,0,0.5); /* سایه از بالا در حالت ستونی */
        }
        @media (min-width: 1024px) {
            .card-visual {
                flex: 1.5;
                padding: 30px;
                box-shadow: inset 20px 0 40px -20px rgba(0,0,0,0.5); /* سایه از کنار در حالت ردیفی */
            }
        }

        /* Browser Mockup Floating (Optimized) */
        @keyframes floatMockup {
            0%, 100% { transform: translateY(0px); box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(59,130,246,0.2); }
            50% { transform: translateY(-12px); box-shadow: 0 35px 60px rgba(0,0,0,0.4), 0 0 45px rgba(59,130,246,0.3); }
        }

        .browser-mockup {
            width: 100%; max-width: 95%; height: 90%;
            background: #0f172a; border-radius: 12px; border: 1px solid #1e293b;
            display: flex; flex-direction: column; overflow: hidden;
            transform: translateY(40px) scale(0.95); opacity: 0;
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative; z-index: 2;
            will-change: transform, opacity;
        }
        @media (min-width: 1024px) {
            .browser-mockup { height: 85%; border-radius: 16px; }
        }
        
        .slide-container.is-active .browser-mockup {
            transform: translateY(0) scale(1); opacity: 1;
            /* انیمیشن بعد از نیم ثانیه شروع میشود تا لودینگ اولیه سبک باشد */
            animation: floatMockup 6s ease-in-out infinite 0.6s; 
        }

        .browser-header { height: 36px; background: #020617; border-bottom: 1px solid #1e293b; display: flex; align-items: center; padding: 0 16px; gap: 8px; }
        .mac-dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red { background: #ff5f56; } .dot-yel { background: #ffbd2e; } .dot-grn { background: #27c93f; }

        .browser-content { flex: 1; position: relative; overflow: hidden; background: #000; }
        .browser-content img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; transition: opacity 0.3s, transform 0.5s; }
        .slide-container.is-active .project-card:hover .browser-content img { opacity: 1; transform: scale(1.03); }

        /* انیمیشن های متن کارت */
        .reveal-item { opacity: 0; transform: translateY(20px); transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .slide-container.is-active .reveal-item { opacity: 1; transform: translateY(0); }
        .slide-container.is-active .delay-1 { transition-delay: 0.1s; }
        .slide-container.is-active .delay-2 { transition-delay: 0.2s; }
        .slide-container.is-active .delay-3 { transition-delay: 0.3s; }
        .slide-container.is-active .delay-4 { transition-delay: 0.4s; }

        .glass-nav-pill {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.15), inset 0 2px 4px rgba(255,255,255,0.8);
        }
        .progress-track { background: rgba(15, 23, 42, 0.1); overflow: hidden; position: relative; }
        .progress-fill { background: linear-gradient(90deg, #3b82f6, #8b5cf6); box-shadow: 0 0 15px rgba(59, 130, 246, 0.8); transition: width 0.3s ease; }
    </style>
</head>

    <script>
        // Parse Django injected data
        const djangoDataElement = document.getElementById('django-projects-data');
        let projects = [];
        try {
            projects = JSON.parse(djangoDataElement.textContent);
        } catch(e) {
            console.error("Failed to parse Django projects JSON", e);
        }

        const sliderTrack = document.getElementById('slider-track');
        const currentNumEl = document.getElementById('current-num');
        const totalNumEl = document.getElementById('total-num');
        const progressFill = document.getElementById('progress-fill');
        const totalProjects = projects.length;

        totalNumEl.innerText = totalProjects.toString().padStart(2, '0');

        function renderProjects() {
            projects.forEach((proj, index) => {
                const tagsHtml = proj.tags.map(tag =>

                                <div class="flex flex-wrap gap-1.5 sm:gap-2 mb-3 sm:mb-5 ltr reveal-item delay-3">

                                <div class="reveal-item delay-4 mt-auto lg:mt-0 pt-1 sm:pt-2">

                                <div class="absolute inset-0 bg-gradient-to-tr from-slate-900 to-slate-800 opacity-90"></div>
                                <div class="absolute w-48 sm:w-72 h-48 sm:h-72 bg-primary/20 blur-[80px] rounded-full pointer-events-none mix-blend-screen"></div>

                                <div class="browser-mockup shadow-[0_30px_60px_rgba(0,0,0,0.6)]">
                                    <div class="browser-header ltr">
                                        <div class="mac-dot dot-red"></div>
                                        <div class="mac-dot dot-yel"></div>
                                        <div class="mac-dot dot-grn"></div>
                                        <div class="ml-2 sm:ml-4 w-24 sm:w-48 h-3 sm:h-4 bg-slate-800/80 rounded-full"></div>
                                    </div>
                                    <div class="browser-content cursor-target" data-cursor="OPEN">
                                        <img src="${proj.image}" alt="${proj.title}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                sliderTrack.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        renderProjects();
        
        const containers = document.querySelectorAll('.slide-container');
        
        // Intersection Observer (Responsive to Snap)
        const observerOptions = {
            root: sliderTrack,
            rootMargin: '0px',
            threshold: 0.55 // When a card is > 55% visible, it becomes active
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    containers.forEach(c => c.classList.remove('is-active'));
                    entry.target.classList.add('is-active');
                    
                    const index = parseInt(entry.target.getAttribute('data-index'));
                    const currentNum = index + 1;
                    currentNumEl.innerText = currentNum.toString().padStart(2, '0');
                    progressFill.style.width = ((currentNum / totalProjects) * 100) + '%';
                }
            });
        }, observerOptions);

        containers.forEach(container => observer.observe(container));

        // استفاده از scrollIntoView که به طور قطعی باگ‌های محاسبه عرض و راست‌چین بودن را رفع می‌کند
        function scrollToIndex(index) {
            if(index < 0 || index >= totalProjects) return;
            const targetContainer = containers[index];
            // این کد در تمام مرورگرها برای گرید/اسلایدر کاملا وسط چین اسکرول میکند
            targetContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }

        // جلوگیری از فشردن سریع و باگ خوردن کلیدها (Debounce)
        let isNavigating = false;
        function handleNavigation(direction) {
            if (isNavigating) return;
            
            const activeContainer = document.querySelector('.slide-container.is-active');
            if(!activeContainer) return;
            let idx = parseInt(activeContainer.getAttribute('data-index'));
            
            isNavigating = true;
            if (direction === 'next') scrollToIndex(idx + 1); // راست چین -> بعدی میره چپ
            if (direction === 'prev') scrollToIndex(idx - 1);
            
            setTimeout(() => { isNavigating = false; }, 400); // 400ms cooldown
        }

        document.getElementById('btn-next').addEventListener('click', () => handleNavigation('next'));
        document.getElementById('btn-prev').addEventListener('click', () => handleNavigation('prev'));

        // Fast Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                e.preventDefault(); 
                handleNavigation('next');
            } else if (e.key === 'ArrowRight') {
                e.preventDefault(); 
                handleNavigation('prev'); 
            }
        });

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                const activeContainer = document.querySelector('.slide-container.is-active');
                if(activeContainer) {
                    // اسکرول آنی (auto) به مرکز برای جلوگیری از به هم ریختگی در زمان تغییر سایز
                    activeContainer.scrollIntoView({ behavior: 'auto', block: 'nearest', inline: 'center' });
                }
            }, 150);
        });

        // Drag to scroll
        let isDown = false; let startX; let scrollLeft;
        sliderTrack.addEventListener('mousedown', (e) => {
            isDown = true; sliderTrack.style.cursor = 'grabbing';
            startX = e.pageX - sliderTrack.offsetLeft;
            scrollLeft = sliderTrack.scrollLeft;
        });
        sliderTrack.addEventListener('mouseleave', () => { isDown = false; sliderTrack.style.cursor = 'grab'; });
        sliderTrack.addEventListener('mouseup', () => { isDown = false; sliderTrack.style.cursor = 'grab'; });
        sliderTrack.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - sliderTrack.offsetLeft;
            sliderTrack.scrollLeft = scrollLeft - ((x - startX) * 2);
        });

        const cursor = document.getElementById('custom-cursor');
        const cursorText = document.getElementById('cursor-text');
        
        if (window.matchMedia("(pointer: fine)").matches) {
            document.addEventListener('mousemove', e => {
                cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px';
            });
            const attachCursorEvents = () => {
                document.querySelectorAll('.cursor-target').forEach(el => {
                    if(el.dataset.cursorAttached) return;
                    el.dataset.cursorAttached = true;
                    el.addEventListener('mouseenter', () => {
                        cursor.classList.add('active');
                        cursorText.innerText = el.getAttribute('data-cursor') || 'EXPLORE';
                    });
                    el.addEventListener('mouseleave', () => cursor.classList.remove('active'));
                });
            };
            attachCursorEvents();
        } else {
            cursor.style.display = 'none';
        }
    </script>
</body>
</html>
