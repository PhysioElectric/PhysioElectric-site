<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پروژه چند صفحه‌ای با اسکرول</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* تنظیم کانتینر اسکرول fullscreen */
    body, html {
      height: 100%;
      overflow: hidden; /* جلوگیری از اسکرول مرورگر */
    }

    .scroll-container {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory; /* قفل شدن روی هر صفحه هنگام اسکرول */
      scroll-behavior: smooth;
    }

    /* بخش مربوط به هر صفحه */
    .page-section {
      height: 100vh;
      width: 100%;
      scroll-snap-align: start; /* هم‌ترازی با بالای صفحه */
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="scroll-container">
    <!-- بخش‌هایی که محتوای صفحات مجزا داخلشان بارگذاری می‌شود -->
    <section class="page-section" data-page="page1.html"></section>
    <section class="page-section" data-page="page2.html"></section>
    <section class="page-section" data-page="page3.html"></section>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sections = document.querySelectorAll('.page-section');

      // لود کردن محتوای هر فایل HTML در بخش مربوط به خودش
      sections.forEach(section => {
        const pageUrl = section.getAttribute('data-page');

        fetch(pageUrl)
          .then(response => {
            if (!response.ok) throw new Error('صفحه یافت نشد');
            return response.text();
          })
          .then(html => {
            section.innerHTML = html;
          })
          .catch(error => {
            section.innerHTML = `<p>خطا در بارگذاری ${pageUrl}</p>`;
            console.error(error);
          });
      });
    });
  </script>
</body>
</html>
