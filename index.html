<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sampatec</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #05060a;
    }
    .scroll-container {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }
    .page-section {
      height: 100vh;
      width: 100%;
      scroll-snap-align: start;
    }
    .page-section iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #05060a;
    }
  </style>
</head>
<body>
  <div class="scroll-container">
    <section class="page-section"><iframe src="page1.html" title="صفحه ۱"></iframe></section>
    <section class="page-section"><iframe src="page2.html" title="صفحه ۲"></iframe></section>
    <section class="page-section"><iframe src="page3.html" title="پروژه‌ها"></iframe></section>
    <section class="page-section"><iframe src="page4.html" title="آزمایشگاه شبیه‌سازی Physio Electric"></iframe></section>
  </div>
</body>
</html>
