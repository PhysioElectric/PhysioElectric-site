<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه ساده من</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            display: inline-block;
            padding-bottom: 5px;
        }
        p {
            color: #34495e;
            font-size: 18px;
            line-height: 1.8;
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .highlight {
            color: #e74c3c;
            font-weight: bold;
        }
        footer {
            margin-top: 40px;
            color: #7f8c8d;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>سلام دنیا! 🌍</h1>
    
    <p>
        این یک <span class="highlight">صفحه HTML ساده</span> است که با زبان فارسی نوشته شده.
        <br>
        از <strong>CSS</strong> برای زیباسازی استفاده شده است.
    </p>

    <p>
        می‌توانید این کد را کپی کنید و در مرورگر خود باز کنید.
    </p>

    <footer>
        ساخته شده با ❤️ توسط شما
    </footer>

</body>
</html>
