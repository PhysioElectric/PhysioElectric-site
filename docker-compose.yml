version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: physio_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=1
    networks:
      - physio_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: physio_frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - physio_net

networks:
  physio_net:
    driver: bridge